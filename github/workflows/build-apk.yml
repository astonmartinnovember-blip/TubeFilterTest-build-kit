name: Build TubeFilterTest APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Checkout upstream NewPipe
        uses: actions/checkout@v4
        with:
          repository: TeamNewPipe/NewPipe
          ref: v0.29.1
          path: upstream
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply prototype identity and record source
        run: |
          python3 scripts/prepare.py upstream
          git -C upstream rev-parse HEAD > upstream/UPSTREAM_COMMIT.txt
          cp NOTICE.md upstream/TUBEFILTERTEST_NOTICE.md
          cp README.md upstream/TUBEFILTERTEST_README.md
          cp scripts/prepare.py upstream/TUBEFILTERTEST_PREPARE.py

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK and corresponding source
        run: |
          mkdir -p deliverables
          python3 scripts/collect.py upstream deliverables
          tar --exclude=.git --exclude=.gradle --exclude=build --exclude=local.properties -czf deliverables/TubeFilterTest-corresponding-source.tar.gz -C upstream .
          cd deliverables
          sha256sum *.apk *.tar.gz > SHA256SUMS.txt

      - name: Upload APK, source and checksums
        uses: actions/upload-artifact@v4
        with:
          name: TubeFilterTest-debug-and-source
          path: deliverables/
          if-no-files-found: error
          retention-days: 14
